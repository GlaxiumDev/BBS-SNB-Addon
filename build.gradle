plugins {
	id 'fabric-loom' version '1.17.13'
	id 'maven-publish'
}

version = project.mod_version + "-" + minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// None of the BBS forks (Base/FS/CML) are published to a maven repository:
	// drop the released jar for whichever one you're building against into
	// the "libs" folder next to this file.
	flatDir {
		dirs 'libs'
	}
}

configurations.all {
	resolutionStrategy {
		eachDependency { DependencyResolveDetails details ->
			if (details.requested.group == 'org.lwjgl') {
				// Minecraft 1.20.1 ships LWJGL 3.3.1 (1.20.2+ bumped to 3.3.2)
				details.useVersion '3.3.1'
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Select one BBS fork explicitly with -Pbbs_jar=libs/<file>.jar. The
	// fallback preserves the convenient local-development behavior where the
	// single enabled jar in libs is used automatically. Fork-specific mixin
	// sources are written to compile against any fork (FS-only APIs are
	// reached through reflection and gated by BBSFbxMixinPlugin at runtime),
	// so switching forks in libs/ never breaks the build.
	def selectedBbsJar = providers.gradleProperty("bbs_jar").orNull
	modImplementation selectedBbsJar != null
		? files(selectedBbsJar)
		: fileTree(dir: "libs", include: "*.jar")

	// Model parsing is implemented in Java and uses Gson/JOML already shipped
	// by Minecraft. No native libraries are bundled in the addon jar.
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE.md") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}

	from("THIRD_PARTY_NOTICES.md")
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
